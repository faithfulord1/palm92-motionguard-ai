name: MotionGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server and browser scripts
        run: npm run check
      - name: Serve the demo
        run: |
          PORT=41819 npm start > /tmp/motionguard.log 2>&1 &
          for i in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:41819/ -o /tmp/motionguard.html; then
              grep -q 'MotionGuard' /tmp/motionguard.html
              exit $?
            fi
            sleep 1
          done
          cat /tmp/motionguard.log
          exit 1
